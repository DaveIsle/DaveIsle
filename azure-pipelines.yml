trigger:
  branches:
    include:
      - Automation

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.0.100-rc.2.25502.107'

# Cache NuGet packages
- task: Cache@2
  inputs:
    key: 'nuget | "$(Agent.OS)" | AllSolution'
    restoreKeys: |
      nuget | "$(Agent.OS)"
    path: ~/.nuget/packages
  displayName: 'Cache NuGet packages'

# Cache .NET tools (before restore)
- task: Cache@2
  inputs:
    key: 'dotnet-tools | "$(Agent.OS)" | AutomationTools'
    path: $(Pipeline.Workspace)/All/Automation/.config
  displayName: 'Cache .NET tools'

# Cache Playwright browsers
- task: Cache@2
  inputs:
    key: 'playwright-browsers | "$(Agent.OS)"'
    path: $(UserProfile)/AppData/Local/ms-playwright
  displayName: 'Cache Playwright Browsers'

# Restore NuGet packages
- script: dotnet restore All/Automation/Automation.csproj
  displayName: 'Restore Automation project'

# Restore .NET tools
- script: |
    cd All/Automation
    dotnet tool restore
  displayName: 'Restore .NET tools'

# Install Playwright browsers (only if not cached)
- script: |
    cd All/Automation
    dotnet tool run playwright install --with-deps
  displayName: 'Install Playwright Browsers'

# Build Automation project
- script: dotnet build All/Automation/Automation.csproj --configuration Release
  displayName: 'Build Automation project'

# Run tests
- script: |
    cd All/Automation
    dotnet test Automation.csproj --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx" --results-directory $(Build.ArtifactStagingDirectory)/test-results
  displayName: 'Run tests'

# Publish test results
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '$(Build.ArtifactStagingDirectory)/test-results/*.trx'
    failTaskOnFailedTests: true
